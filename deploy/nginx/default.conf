# In the stock unprivileged NGINX image, conf.d/*.conf is loaded inside http{}.
# No location below defines its own add_header: keep the server-level security
# headers inherited, including 404/error responses.
#
# Only Vite fingerprinted assets get immutable caching. Everything else,
# including HTML, manifest and fallback routes, gets no-store.
map $uri $veilchat_asset_cache_control {
    default "no-store";
    "~^/assets/[^/]+-[A-Za-z0-9_-]{8,}\.(?:js|css|svg|png|woff2|webp|wasm)$" "public, max-age=31536000, immutable";
}

# Missing assets and errors must never inherit immutable caching.
map $status $veilchat_response_cache_control {
    default "no-store";
    200 $veilchat_asset_cache_control;
    304 $veilchat_asset_cache_control;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; manifest-src 'self'; worker-src 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), display-capture=()" always;
    add_header Cache-Control $veilchat_response_cache_control always;

    # Coolify/reverse proxy terminates HTTPS. Add HSTS only on the verified
    # external HTTPS ingress, not blindly on this internal HTTP container.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API endpoints are intentionally NOT routed by this static-only image.
    location /api/ { return 404; }
    location /_matrix/ { return 404; }

    # Missing hashed assets must return 404, not an HTML app shell.
    location /assets/ { try_files $uri =404; }

    # No hidden files in the built static tree.
    location ~ /\. { return 404; }

    # Client-side routes can fall back to index.html. Internal redirect to
    # /index.html re-evaluates the cache map and retains the security headers.
    location / { try_files $uri $uri/ /index.html; }
}
