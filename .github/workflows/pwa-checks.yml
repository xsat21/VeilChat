name: PWA checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pwa-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clean reproducible install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify frontend security guard, types and production bundle
        run: npm run verify
      - name: Verify CSP in real headless Chrome
        run: npm run security:browser-test
      - name: Verify build entrypoint
        run: test -s dist/index.html
      - name: Verify no undeclared build secrets
        run: |
          if grep -R -E '(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' dist/; then
            echo "::error::Possible private key material in build output"
            exit 1
          fi
      - name: Upload build artifact (review only)
        uses: actions/upload-artifact@v4
        with:
          name: veilchat-static-build
          path: dist/
          retention-days: 3

  docker-static-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build runtime image (fresh base layers)
        run: docker build --pull --tag veilchat-web:ci .
      - name: Start hardened image and verify NGINX
        run: |
          docker run -d --name veilchat-static-ci \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 100 --memory 256m \
            -p 127.0.0.1:18080:8080 veilchat-web:ci
          docker exec veilchat-static-ci nginx -t
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:18080/healthz > /dev/null; then exit 0; fi
            sleep 1
          done
          docker logs veilchat-static-ci
          exit 1
      - name: Test HTTP CSP, caching and protected routes
        run: node scripts/deployment-http-test.mjs
        env:
          DEPLOY_URL: http://127.0.0.1:18080
      - name: Inspect container runtime state
        run: |
          test "$(docker inspect -f '{{.Config.User}}' veilchat-static-ci)" != "root"
          test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' veilchat-static-ci)" = "true"
          test "$(docker inspect -f '{{.HostConfig.Privileged}}' veilchat-static-ci)" = "false"
      - name: Cleanup
        if: always()
        run: |
          docker logs veilchat-static-ci || true
          docker rm -f veilchat-static-ci || true
