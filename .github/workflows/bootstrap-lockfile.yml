name: Bootstrap reproducible PWA lockfile

on:
  push:
    branches: [ci/lockfile-reproducible-build]

permissions:
  contents: write

jobs:
  lockfile:
    if: github.repository == 'xsat21/VeilChat'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve pinned lockfile without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean reproducible install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate types and production bundle
        run: |
          npm run check
          npm run build
          test -s dist/index.html
      - name: Commit generated lockfile to this feature branch only
        env:
          TARGET_REF: ci/lockfile-reproducible-build
        run: |
          test "$GITHUB_REF_NAME" = "$TARGET_REF"
          test -s package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): commit resolved npm lockfile"
            git push origin "HEAD:refs/heads/$TARGET_REF"
          fi
