name: Bootstrap npm lockfile

on:
  push:
    branches: [chore/reproducible-npm-ci]
    paths: ['.github/workflows/bootstrap-lockfile.yml']

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate clean dependency installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and build
        run: |
          npm run check
          npm run build
      - name: Commit lockfile to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "chore: commit generated npm lockfile"
          git push origin HEAD:chore/reproducible-npm-ci
